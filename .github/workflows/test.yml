name: Test

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify Electron bridge and actual startup
        run: |
          xvfb-run --auto-servernum ./node_modules/.bin/electron vendor/electron-phone-passkey/scripts/renderer-smoke.cjs --no-sandbox --ozone-platform=x11
          xvfb-run --auto-servernum ./node_modules/.bin/electron scripts/phone-profile-smoke.cjs --no-sandbox --ozone-platform=x11

      - name: Build and verify packaged startup
        run: |
          npm run pack
          PROSPECT_PHONE_PACKAGE_ASAR="$PWD/dist/linux-unpacked/resources/app.asar" xvfb-run --auto-servernum ./node_modules/.bin/electron scripts/phone-profile-smoke.cjs --no-sandbox --ozone-platform=x11
